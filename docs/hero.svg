<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="TinyLink Animated Hero Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="65%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#0B1922"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="gridDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.14"/>
    </pattern>
    <style>
      .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.35); }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatGlow {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      @keyframes packetMove {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(58px); opacity: 0; }
      }
      .pulse-dot { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.2s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 5 5; animation: flowDash 1.2s linear infinite; }
      .packet-dot { animation: packetMove 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .card-glow { animation: floatGlow 3.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="896" height="266" rx="18" fill="url(#bgGrad)" stroke="#2A364F" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="266" rx="18" fill="url(#gridDots)"/>
  <ellipse cx="720" cy="40" rx="180" ry="90" fill="#22C55E" opacity="0.06"/>
  <ellipse cx="780" cy="220" rx="160" ry="80" fill="#38BDF8" opacity="0.06"/>

  <!-- Top Status Badge -->
  <rect x="38" y="34" width="222" height="28" rx="14" fill="#111827" stroke="#2A364F" stroke-width="1"/>
  <circle class="pulse-dot" cx="55" cy="48" r="4.5" fill="#22C55E"/>
  <text x="68" y="52" class="mono" font-size="11.5" font-weight="600" fill="#94A3B8">EDGE ACTIVE · $0 CLOUDFLARE</text>

  <!-- Brand Lockup -->
  <rect x="38" y="80" width="44" height="44" rx="11" fill="#132A24" stroke="#22C55E" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M55 108a7.5 7.5 0 0 0 10.6 0l5.3-5.3a7.5 7.5 0 0 0-10.6-10.6l-2.65 2.65M65 96a7.5 7.5 0 0 0-10.6 0l-5.3 5.3a7.5 7.5 0 0 0 10.6 10.6l2.65-2.65" fill="none" stroke="#22C55E" stroke-width="2.6" stroke-linecap="round"/>

  <text x="96" y="112" class="mono" font-size="34" font-weight="700" fill="#F8FAFC" letter-spacing="-1">TinyLink</text>

  <text x="38" y="152" class="sans" font-size="15.5" font-weight="500" fill="#CBD5E1">Self-hosted edge URL shortener, QR code studio,</text>
  <text x="38" y="174" class="sans" font-size="15.5" font-weight="500" fill="#94A3B8">and click telemetry built on Workers + KV.</text>

  <!-- Feature Pills -->
  <g transform="translate(38, 204)">
    <rect x="0" y="0" width="96" height="28" rx="7" fill="#111827" stroke="#2A364F"/>
    <text x="48" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#38BDF8">TypeScript</text>

    <rect x="106" y="0" width="94" height="28" rx="7" fill="#111827" stroke="#2A364F"/>
    <text x="153" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#22C55E">Workers+KV</text>

    <rect x="210" y="0" width="88" height="28" rx="7" fill="#111827" stroke="#2A364F"/>
    <text x="254" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#F8FAFC">SVG / PNG</text>

    <rect x="308" y="0" width="92" height="28" rx="7" fill="#111827" stroke="#2A364F"/>
    <text x="354" y="18" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#F59E0B">PWA Share</text>
  </g>

  <!-- Right Live Simulation Widget -->
  <g transform="translate(500, 32)">
    <rect x="0" y="0" width="362" height="206" rx="14" fill="#111827" stroke="#2A364F" stroke-width="1.5"/>

    <!-- Top Long URL Box -->
    <rect x="16" y="16" width="330" height="42" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="28" y="33" class="mono" font-size="10" fill="#64748B">LONG DESTINATION</text>
    <text x="28" y="49" class="mono" font-size="11.5" fill="#CBD5E1">https://example.com/docs/v2?ref=share...</text>

    <!-- Animated Beam Down -->
    <line x1="181" y1="60" x2="181" y2="122" stroke="url(#accentGrad)" stroke-width="2" class="flow-line"/>
    <circle class="packet-dot" cx="181" cy="64" r="4" fill="#22C55E"/>

    <!-- Edge Node Chip -->
    <rect x="111" y="76" width="140" height="26" rx="13" fill="#090D16" stroke="#22C55E" stroke-opacity="0.55"/>
    <text x="181" y="93" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#22C55E">EDGE · &lt;3ms PUT</text>

    <!-- Output Short Link Card -->
    <rect class="card-glow" x="16" y="124" width="330" height="66" rx="10" fill="#090D16" stroke="#22C55E" stroke-opacity="0.5"/>

    <!-- Mini QR Graphic inside output -->
    <g transform="translate(26, 134)">
      <rect width="46" height="46" rx="6" fill="#FFFFFF"/>
      <rect x="6" y="6" width="12" height="12" fill="#0F172A"/>
      <rect x="9" y="9" width="6" height="6" fill="#FFFFFF"/>
      <rect x="28" y="6" width="12" height="12" fill="#0F172A"/>
      <rect x="31" y="9" width="6" height="6" fill="#FFFFFF"/>
      <rect x="6" y="28" width="12" height="12" fill="#0F172A"/>
      <rect x="9" y="31" width="6" height="6" fill="#FFFFFF"/>
      <rect x="22" y="22" width="6" height="6" fill="#0F172A"/>
      <rect x="32" y="26" width="8" height="6" fill="#0F172A"/>
      <rect x="24" y="34" width="12" height="6" fill="#0F172A"/>
    </g>

    <text x="84" y="144" class="mono" font-size="10" font-weight="600" fill="#22C55E">LINK READY · 302</text>
    <text x="84" y="164" class="mono" font-size="14" font-weight="700" fill="#38BDF8">go.domain.com/launch</text>
    <text x="84" y="180" class="sans" font-size="11" fill="#94A3B8">QR generated · Analytics live</text>
  </g>
</svg>
