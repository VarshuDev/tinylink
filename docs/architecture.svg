<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="TinyLink Edge Architecture &amp; Telemetry Flow">
  <defs>
    <style>
      .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes stream {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes barPulse1 { 0%, 100% { height: 22px; y: 120px; } 50% { height: 34px; y: 108px; } }
      @keyframes barPulse2 { 0%, 100% { height: 36px; y: 106px; } 50% { height: 26px; y: 116px; } }
      @keyframes barPulse3 { 0%, 100% { height: 28px; y: 114px; } 50% { height: 44px; y: 98px; } }
      @keyframes barPulse4 { 0%, 100% { height: 42px; y: 100px; } 50% { height: 30px; y: 112px; } }
      @keyframes moveRight1 {
        0% { transform: translateX(0px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(52px); opacity: 0; }
      }
      .wire { stroke-dasharray: 6 6; animation: stream 1s linear infinite; }
      .dot1 { animation: moveRight1 1.8s ease-in-out infinite; }
      .dot2 { animation: moveRight1 1.8s ease-in-out 0.9s infinite; }
      .b1 { animation: barPulse1 2.4s ease-in-out infinite; }
      .b2 { animation: barPulse2 2.4s ease-in-out infinite; }
      .b3 { animation: barPulse3 2.4s ease-in-out infinite; }
      .b4 { animation: barPulse4 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="216" rx="16" fill="#090D16" stroke="#2A364F" stroke-width="2"/>

  <!-- Card 1: Client and Quick Capture -->
  <rect x="24" y="26" width="240" height="168" rx="12" fill="#111827" stroke="#2A364F"/>
  <rect x="38" y="40" width="82" height="22" rx="6" fill="#132A24" stroke="#22C55E" stroke-opacity="0.4"/>
  <text x="79" y="55" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#22C55E">1. CAPTURE</text>
  <text x="38" y="84" class="sans" font-size="15" font-weight="700" fill="#F8FAFC">Console &amp; Shortcuts</text>
  <text x="38" y="106" class="mono" font-size="11" fill="#94A3B8">POST /api/shorten</text>
  <text x="38" y="126" class="sans" font-size="12" fill="#CBD5E1">• PWA OS Share Sheet</text>
  <text x="38" y="145" class="sans" font-size="12" fill="#CBD5E1">• Omnibox &amp; Bookmarklet</text>
  <text x="38" y="164" class="sans" font-size="12" fill="#CBD5E1">• Auth Token Vault</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="268" y1="110" x2="326" y2="110" stroke="#22C55E" stroke-width="2" class="wire"/>
  <circle class="dot1" cx="270" cy="110" r="4" fill="#22C55E"/>

  <!-- Card 2: Edge Worker and KV -->
  <rect x="330" y="26" width="240" height="168" rx="12" fill="#111827" stroke="#2A364F"/>
  <rect x="344" y="40" width="76" height="22" rx="6" fill="#10253A" stroke="#38BDF8" stroke-opacity="0.4"/>
  <text x="382" y="55" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#38BDF8">2. ROUTE</text>
  <text x="344" y="84" class="sans" font-size="15" font-weight="700" fill="#F8FAFC">Cloudflare Worker</text>
  <text x="344" y="106" class="mono" font-size="11" fill="#94A3B8">KV Lookup + 302 / 410</text>
  <text x="344" y="126" class="sans" font-size="12" fill="#CBD5E1">• Password &amp; click caps</text>
  <text x="344" y="145" class="sans" font-size="12" fill="#CBD5E1">• Bot preview / OG cards</text>
  <text x="344" y="164" class="sans" font-size="12" fill="#CBD5E1">• Auth 429 rate guard</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="574" y1="110" x2="632" y2="110" stroke="#38BDF8" stroke-width="2" class="wire"/>
  <circle class="dot2" cx="576" cy="110" r="4" fill="#38BDF8"/>

  <!-- Card 3: Async Telemetry and QR -->
  <rect x="636" y="26" width="240" height="168" rx="12" fill="#111827" stroke="#2A364F"/>
  <rect x="650" y="40" width="96" height="22" rx="6" fill="#261D12" stroke="#F59E0B" stroke-opacity="0.45"/>
  <text x="698" y="55" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#F59E0B">3. INSPECT</text>
  <text x="650" y="84" class="sans" font-size="15" font-weight="700" fill="#F8FAFC">Live Telemetry</text>

  <!-- Mini animated timeline chart -->
  <rect x="650" y="96" width="96" height="54" rx="6" fill="#090D16" stroke="#1E293B"/>
  <rect class="b1" x="660" y="120" width="12" height="22" rx="3" fill="#38BDF8"/>
  <rect class="b2" x="680" y="106" width="12" height="36" rx="3" fill="#22C55E"/>
  <rect class="b3" x="700" y="114" width="12" height="28" rx="3" fill="#38BDF8"/>
  <rect class="b4" x="720" y="100" width="12" height="42" rx="3" fill="#22C55E"/>

  <text x="758" y="112" class="sans" font-size="11.5" fill="#CBD5E1">Countries</text>
  <text x="758" y="129" class="sans" font-size="11.5" fill="#CBD5E1">Bot shield</text>
  <text x="758" y="146" class="sans" font-size="11.5" fill="#CBD5E1">SVG &amp; PNG</text>

  <text x="650" y="172" class="mono" font-size="10.5" fill="#94A3B8">Async ctx.waitUntil()</text>
</svg>
